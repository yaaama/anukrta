repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.1.12
    hooks:
      - id: clang-format
        args: [--style=file]  # Loads style from .clang-format file
        files: ^(src|include)/.*\.(h|c)$ # Limits to specific dirs and file types
      - id: clang-tidy
        args: [--checks=.clang-tidy --fix] # Loads checks from .clang-tidy file
        files: ^(src|include)/.*\.(h|c)$ # Limits to specific dirs and file types
